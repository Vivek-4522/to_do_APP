<!DOCTYPE html>
<html lang="en">
<head>
    {%load static%}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="{% static 'style.css'%}"

   
</head>
<body>

    <div class="todo-container">
        <h1>Todo List</h1>

        <form class="todo-input" method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Enter task..." required>
            <button type="submit">Add</button>
        </form>

        
        <ul class="todo-list">
            {%for i in task_data%}
            <li>
             <span>{{i.title}}</span>

                <div class="actions">
                    <input type="checkbox">
                    <a href="{% url 'delete' i.id %}" class="delete-btn">X</a>
                </div>
            </li>
            {%endfor%}
        </ul>
    </div>

</body>
</html>
